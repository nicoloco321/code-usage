# Claude Code usage display - Raspberry Pi settings.
#
# pi/install.sh copies this to ~/.config/claude-display/config.ini. Restart the
# display after editing it (sudo systemctl restart claude-display, or reboot).
# Treat that copy like a password: it holds OAuth refresh tokens.

[anthropic]
# The display's own login, separate from your everyday Claude Code session.
# Mint it and save it here in one go with:
#   python3 server/device_login.py --config ~/.config/claude-display/config.ini
# (Don't use `claude setup-token` - those tokens can't read usage.)
refresh_token =

# Seconds between usage fetches (at least 60). The endpoint is rate-limited
# tightly (60s tripped it in practice); the numbers move slowly and the
# spinner reacts to beacons instantly regardless. While another screen is
# showing it polls 3x less often, and catches up when you switch back.
poll_seconds = 180

[spotify]
# Optional now-playing screen - leave empty to disable. Mint both with:
#   python3 server/spotify_login.py --config ~/.config/claude-display/config.ini
client_id =
refresh_token =

# Seconds between now-playing fetches; the progress bar ticks locally between.
poll_seconds = 5

[bambu]
# Optional 3D printer screen for a Bambu Lab printer on your network. The
# easy way to fill these in:
#   python3 pi/claude_display.py --setup-bambu
# (it finds the printer and asks for the access code). By hand: host is the
# printer's IP, serial its serial number, and access_code the code on the
# printer's screen under Settings > WLAN (Network on an X1). Leave empty to
# disable.
host =
serial =
access_code =
name =

[planes]
# Optional planes-overhead screen: the nearest aircraft in the air, a photo of
# that exact airframe, where it's headed, and a radar of everything around.
# It needs to know where you are - the easy way:
#   python3 pi/claude_display.py --setup-planes
# Leave lat / lon empty to disable. Positions come from adsb.fi (adsb.lol if
# it's down), routes from adsb.im / adsbdb, photos from planespotters.net.
lat =
lon =

# How far out to look, in nautical miles (2-60).
radius_nm = 15

# Seconds between position updates while the screen is showing (at least 5).
poll_seconds = 10

# Aircraft art made by pi/build_liveries.py (on your PC, then copied here):
# side views of each plane in its airline's livery, or blank for its type.
# Empty = ~/.local/share/claude-display/liveries. Without it, planespotters
# photos only.
liveries =

[server]
# Beacons and screen switching - the same HTTP API as the ESP32 firmware, so
# keep 8080 unless you also change your hooks.
port = 8080

# Safety backstop: fall back to idle if no beacon arrives for this long. The
# real "stopped" signal is POST /thinking/off from the Stop hook.
beacon_ttl_seconds = 300

[screen]
# Leave empty for the monitor's native resolution. Something like 1280x720
# means fewer pixels to push on a big TV (easier on a Pi 2).
size =

# Rotate the picture clockwise: 0, 90, 180 or 270 - e.g. 90 (or 270) to lay
# a portrait panel such as the Waveshare 11.9" (320x1480) on its side. The
# layout follows the result's shape: landscape, portrait, a long bar, or a
# tall strip.
rotate = 0
