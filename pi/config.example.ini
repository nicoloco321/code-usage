# Claude Code usage display - Raspberry Pi settings.
#
# pi/install.sh copies this to ~/.config/claude-display/config.ini. Restart the
# display after editing it (sudo systemctl restart claude-display, or reboot).
# Treat that copy like a password: it holds OAuth refresh tokens.

[anthropic]
# The display's own login, separate from your everyday Claude Code session.
# Mint it and save it here in one go with:
#   python3 server/device_login.py --config ~/.config/claude-display/config.ini
# (Don't use `claude setup-token` - those tokens can't read usage.)
refresh_token =

# Seconds between usage fetches. The endpoint is rate-limited tightly (60s
# still tripped it in practice); the numbers move slowly and the spinner reacts
# to beacons instantly regardless.
poll_seconds = 90

[spotify]
# Optional now-playing screen - leave empty to disable. Mint both with:
#   python3 server/spotify_login.py --config ~/.config/claude-display/config.ini
client_id =
refresh_token =

# Seconds between now-playing fetches; the progress bar ticks locally between.
poll_seconds = 5

[server]
# Beacons and screen switching - the same HTTP API as the ESP32 firmware, so
# keep 8080 unless you also change your hooks.
port = 8080

# Safety backstop: fall back to idle if no beacon arrives for this long. The
# real "stopped" signal is POST /thinking/off from the Stop hook.
beacon_ttl_seconds = 300

[screen]
# Leave empty for the monitor's native resolution. Something like 1280x720
# means fewer pixels to push on a big TV (easier on a Pi 2).
size =

# Rotate the picture clockwise: 0, 90, 180 or 270 - e.g. 90 (or 270) to lay
# a portrait panel such as the Waveshare 11.9" (320x1480) on its side. The
# layout follows the result's shape: landscape, portrait, a long bar, or a
# tall strip.
rotate = 0
